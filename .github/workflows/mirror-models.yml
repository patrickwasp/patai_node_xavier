# Mirror the pinned models into Wasupu's bucket, whole and named by their hashes, from their own addresses: on
# GitHub's side, so nobody's connection carries them (scripts/mirror-models). Run it after pinning a model with a
# mirror. A run that stops carries on from where it was when run again.
name: Mirror models

on:
  workflow_dispatch:
    inputs:
      names:
        description: Model files to mirror, separated by spaces; every pinned one with a mirror if empty
        required: false

permissions:
  contents: read

concurrency:
  group: mirror-models

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: boto3
        run: python3 -m venv /tmp/venv && /tmp/venv/bin/pip install --quiet boto3==1.44.9
      - name: Mirror
        env:
          NAMES: ${{ inputs.names }}
          # Deployed copies of the keys in Infisical (ops inventory/services.yaml, ovhcloud-wasupu).
          WASUPU_OVH_XAVIER_ROGUE_S3_ACCESS_KEY: ${{ secrets.WASUPU_OVH_XAVIER_ROGUE_S3_ACCESS_KEY }}
          WASUPU_OVH_XAVIER_ROGUE_S3_SECRET_KEY: ${{ secrets.WASUPU_OVH_XAVIER_ROGUE_S3_SECRET_KEY }}
        run: /tmp/venv/bin/python -I scripts/mirror-models $NAMES
