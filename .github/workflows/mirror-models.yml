# Mirror the pinned models into this repo's `models` release, in pieces, from their own addresses: on GitHub's side,
# so nobody's connection carries them (scripts/mirror-models). Run it after pinning a model with a mirror.
name: Mirror models

on:
  workflow_dispatch:
    inputs:
      names:
        description: Model files to mirror, separated by spaces; every pinned one with a mirror if empty
        required: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: The models release
        run: |
          gh release view models >/dev/null 2>&1 || gh release create models --latest=false --title "Models" \
            --notes "Pinned models, in 1 GiB pieces that nodes download several at once. Each is the file its own
          address serves, under its own licence, as the manifest that pins it says."
      - name: Mirror
        env:
          NAMES: ${{ inputs.names }}
        run: python3 -I scripts/mirror-models $NAMES
