# patai's own chat server, for Chat (docs/apps.md, The Chat app): people and their sessions, chats and answers,
# in its Postgres, and the API at /api/v1 that the web app and the phone apps use. The console's proxy for the app's
# pages sends /api/ here. It reaches the node's model through the gateway for apps, with the app's own key. Its image
# is built in patai_chat and holds the web app too; manifest.json pins it. It keeps the photos people send in
# /data/chat-server.
#
#   sudo patai-fetch chat-server               on the node: the image, checked against the pin
services:
  server:
    # Back after a crash, but not by itself at boot: patai-workload decides what runs, and opens the gate.
    restart: on-failure
    image: ghcr.io/patrickwasp/patai-chat:0.33.1-written.1
    user: "10021:10021"
    read_only: true
    ports:
      - "127.0.0.1:18310:4000"
    # Its Postgres on patai-chat, which has no way out, and out through patai-web: the pages it reads, Gmail,
    # connectors and outside models.
    networks: [chat, web]
    # The console's gateway for apps, which only containers reach.
    extra_hosts:
      - "patai-gateway:host-gateway"
    tmpfs:
      - /tmp
    volumes:
      - /data/chat-server:/data
      # The gate. Without it the container can't start, and /run is empty after every boot.
      - type: bind
        source: /run/patai/apps/chat-server
        target: /run/patai-gate
        read_only: true
        bind:
          create_host_path: false
    environment:
      - HOST=0.0.0.0
      # Node's heap no bigger than reading a 1,000-page PDF needs, so what's thrown away is taken back as it goes:
      # without it the server reached 313 MiB doing that.
      - NODE_OPTIONS=--max-old-space-size=192
      - PATAI_DATA_DIR=/data
      - DATABASE_URL=postgres://patai:${POSTGRES_PASSWORD}@chat-postgres:5432/patai_chat
      - BETTER_AUTH_SECRET
      # What connectors' sign-ins and people's secrets are sealed with, apart from the database on /data (patai_docs
      # notes/vault.md, Keys). In /persist with the other secrets, and in backups.
      - PATAI_SEALING_KEY
      # The owner's account, made at the first start only, while nobody can sign in.
      - PATAI_OWNER_USERNAME
      - PATAI_OWNER_PASSWORD
      - PATAI_GATEWAY_URL=http://patai-gateway:18000
      - PATAI_GATEWAY_KEY
      # The app's APIs that are on, which patai-workload gives at each start: search, embeddings, images.
      - PATAI_APIS
      # Where the console is, at the same name, for an owner's link to it (docs/console.md, The front page).
      - PATAI_CONSOLE_PORT=9443
      # Each person's file space, as the owner sets it on the Apps page.
      - PATAI_FILES_GB
networks:
  chat:
    name: patai-chat
    external: true
  web:
    name: patai-web
    external: true
