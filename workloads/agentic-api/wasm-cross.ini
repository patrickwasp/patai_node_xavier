# meson's cross file for a package's extensions in the code interpreter's guest (Dockerfile, wasm stage): wasi-sdk's
# clang for wasm32-wasip2, each extension a shared library linked against the WASI build's libpython3.14.so, which
# Eryx links them to at run time. Nothing built can run here, so what meson would learn by running it is given.
[binaries]
# wasm-cc.sh: wasi-sdk's clang, with libpython for an extension.
c = '/wasm/bin/cc'
cpp = '/wasm/bin/c++'
ar = '/opt/wasi-sdk/bin/llvm-ar'
strip = '/opt/wasi-sdk/bin/llvm-strip'
# An extension is a core module Eryx links, not a component: wasm-ld, not wasip2's wasm-component-ld.
c_ld = 'lld'
cpp_ld = 'lld'

[built-in options]
c_args = ['--target=wasm32-wasip2', '-fPIC', '-I/wasm/cpython/builddir/wasi/install/include/python3.14']
cpp_args = ['--target=wasm32-wasip2', '-fPIC', '-I/wasm/cpython/builddir/wasi/install/include/python3.14']
c_link_args = ['--target=wasm32-wasip2']
cpp_link_args = ['--target=wasm32-wasip2']

[properties]
needs_exe_wrapper = true
skip_sanity_check = true
# A long double on wasm32 is IEEE 754's binary128.
longdouble_format = 'IEEE_QUAD_LE'

[host_machine]
system = 'wasi'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'
