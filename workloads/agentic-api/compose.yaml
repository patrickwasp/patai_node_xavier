# vLLM's agentic-api: Responses with conversations kept, Anthropic's Messages, and tools it runs itself, such as web
# search and the code interpreter, in front of the language model (docs/apps.md, The agentic API). manifest.json pins
# its image. It keeps its conversations in SQLite, and the code interpreter's containers, in /data/agentic-api.
#
#   sudo patai-fetch agentic-api               on the unit: the image, checked against the pin
#   scripts/workload agentic-api up -d server   on 127.0.0.1:18090, through the console at https://<unit>/v1
services:
  server:
    # Back after a crash, but not by itself at boot: patai-workload decides what runs, and opens the gate.
    restart: on-failure
    image: ghcr.io/patrickwasp/patai-agentic-api:v0.10.0-5
    build: .
    # The code interpreter runs each piece of code in a worker of its own, in a cgroup below the container's that it
    # holds to the worker's memory, processes and a core. patai-delegate makes that possible: the container's cgroup
    # namespace writable, and a part of it the container's user's, for a container that is refused unless nothing in
    # it is root or has a capability (docs/apps.md, The code interpreter).
    runtime: patai-delegate
    cgroup: private
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    # Nothing much: the interpreter's own temporary files are in TMPDIR, below.
    tmpfs:
      - /tmp:nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
    # A worker at its limit, the server, and the runtime's pages they map.
    mem_limit: 1g
    pids_limit: 256
    # The language model and SearXNG by name, on a network of their own: its loopback is its own, so a request can't
    # name an MCP server on the unit's. Out through patai-web, to a search provider and the MCP servers a request names.
    networks: [web, ai]
    ports:
      - "127.0.0.1:18090:9000"
    volumes:
      - /data/agentic-api:/var/lib/agentic-api
      # The gate. Without it the container can't start, and /run is empty after every boot.
      - type: bind
        source: /run/patai/apps/agentic-api
        target: /run/patai-gate
        read_only: true
        bind:
          create_host_path: false
    # The search provider and its key are settings, from manifest.json, passed in by name.
    environment:
      - LLM_API_BASE=http://llama-cpp:8080/v1
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=9000
      - AGENTIC_WEB_SEARCH_PROVIDER
      - AGENTIC_WEB_SEARCH_BASE_URL
      - BRAVE_API_KEY
      - TAVILY_API_KEY
      - YOU_API_KEY
      - SERPLY_API_KEY
      # The interpreter's workers: Eryx's runtime, pre-initialized with the packages, and the standard library, which
      # the first one unpacks and the others map and check, and each one's socket to the server. On the disk, not in
      # memory, as the runtime is a hundred MB.
      - TMPDIR=/var/lib/agentic-api/tmp
      - AGENTIC_CODE_INTERPRETER_ENABLED
      # Each run's limits, from runs on patai-dev (docs/apps.md, The code interpreter): the guest's memory, Wasmtime's,
      # and the worker's, its cgroup's; its time, and Wasmtime's fuel; and one run at a time, so that a computer still
      # fits beside the 26B. A tool call gets 60 s in all (agentic-api's GATEWAY_TOOL_TIMEOUT), which drops one still
      # running and kills its worker: the run has 45 of them, and starting it and its variables the rest.
      - AGENTIC_CODE_INTERPRETER_MAX_GUEST_MEMORY_BYTES=268435456
      - AGENTIC_CODE_INTERPRETER_MAX_WORKER_MEMORY_BYTES=402653184
      - AGENTIC_CODE_INTERPRETER_EXECUTION_WALL_TIME_SECONDS=45
      - AGENTIC_CODE_INTERPRETER_MAX_FUEL=150000000000
      - AGENTIC_CODE_INTERPRETER_MAX_CONCURRENT_GUESTS=1
      - AGENTIC_CODE_INTERPRETER_MAX_AGGREGATE_GUEST_MEMORY_BYTES=268435456
      - AGENTIC_CODE_INTERPRETER_MAX_AGGREGATE_WORKER_MEMORY_BYTES=402653184
      # Containers: a conversation's files at /mnt/data and its variables, kept on the disk until they've been idle
      # for 20 minutes, 512 MiB and 1,000 files each, 32 at most, as Chat makes one for each chat that runs code.
      - AGENTIC_CODE_INTERPRETER_MAX_CONTAINERS=32
      - AGENTIC_CODE_INTERPRETER_CONTAINER_MAX_BYTES=536870912
      - AGENTIC_CODE_INTERPRETER_CONTAINER_MAX_FILES=1000
      - AGENTIC_CODE_INTERPRETER_CONTAINER_IDLE_MINUTES=20
networks:
  web:
    name: patai-web
    external: true
  ai:
    name: patai-ai
    external: true
