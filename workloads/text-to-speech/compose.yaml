# Piper and sanoTTS on the CPU, behind the text-to-speech APIs (docs/apps.md, Voice). manifest.json pins its image,
# models and voices, in /data/models/text-to-speech, and the server reads its voices from it.
#
#   sudo patai-fetch text-to-speech                    on the unit: the image and models, checked against the pins
#   scripts/workload text-to-speech build
#   scripts/workload text-to-speech up -d server         OpenAI's /v1/audio/speech on 127.0.0.1:18401
services:
  server:
    # Back after a crash, but not by itself at boot: patai-workload decides what runs, and opens the gate.
    restart: on-failure
    image: ghcr.io/patrickwasp/patai-text-to-speech:2026.11.23-voices
    build: .
    ports:
      - "127.0.0.1:18401:8080"
    # No name from outside the node: Docker's resolver answers its containers' names and asks this address for the
    # rest, from the container, where the firewall refuses it. Nobody has the address (docs/apps.md, The internet).
    dns: [192.0.2.1]
    # Half the cores: a sentence takes a fraction of a second, and the chat model keeps the rest.
    cpus: 4
    environment:
      - TTS_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    read_only: true
    # py3langid unpacks its model here as it starts, 65 MiB it then deletes; phonemizer loads espeak-ng from a copy
    # here, which needs exec; and sano's voices are linked here under the names sanoTTS reads.
    tmpfs:
      - /tmp:size=96m,exec
    # Root in it reads the voices, which are root's alone, as their owner, and needs nothing more.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /data/models/text-to-speech:/models:ro
      - ./manifest.json:/etc/patai-speech/manifest.json:ro
      # The gate. Without it the container can't start, and /run is empty after every boot.
      - type: bind
        source: /run/patai/apps/text-to-speech
        target: /run/patai-gate
        read_only: true
        bind:
          create_host_path: false
    command: ["/etc/patai-speech/manifest.json"]
