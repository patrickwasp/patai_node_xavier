# Open WebUI, the Chat app's web app (docs/apps.md, The Chat app), on a Postgres and a Valkey of its own. It reaches
# the node's model, embeddings, search and images through the console's gateway for apps, with the app's own key, and
# its pages through the console on 8443. manifest.json pins its image. It keeps uploads and its cache in
# /data/open-webui, and everything else in its Postgres.
#
#   sudo patai-fetch open-webui                on the node: the image, checked against the pin
#   scripts/workload open-webui build
services:
  server:
    # Back after a crash, but not by itself at boot: patai-workload decides what runs, and opens the gate.
    restart: on-failure
    image: ghcr.io/patrickwasp/patai-open-webui:v0.13.3
    build: .
    user: "10010:10010"
    read_only: true
    ports:
      - "127.0.0.1:18300:8080"
    networks: [chat]
    # The console's gateway for apps, which only containers reach.
    extra_hosts:
      - "patai-gateway:host-gateway"
    tmpfs:
      - /tmp
    volumes:
      - /data/open-webui:/app/backend/data
      # The gate. Without it the container can't start, and /run is empty after every boot.
      - type: bind
        source: /run/patai/apps/open-webui
        target: /run/patai-gate
        read_only: true
        bind:
          create_host_path: false
    environment:
      - DATABASE_URL=postgresql://openwebui:${POSTGRES_PASSWORD}@open-webui-postgres:5432/openwebui
      - VECTOR_DB=pgvector
      - REDIS_URL=redis://:${VALKEY_PASSWORD}@open-webui-valkey:6379/0
      - WEBSOCKET_MANAGER=redis
      - ENABLE_WEBSOCKET_SUPPORT=true
      - WEBUI_SECRET_KEY
      # The owner's account, made at the first start only (docs/apps.md, The Chat app). It also turns sign-up off.
      - WEBUI_ADMIN_EMAIL
      - WEBUI_ADMIN_PASSWORD
      - WEBUI_ADMIN_NAME=Owner
      - ENABLE_SIGNUP=false
      # Everyone signed in may use the node's model.
      - BYPASS_MODEL_ACCESS_CONTROL=true
      # Nothing at its start depends on the internet: no update check, and no models of its own to download.
      - OFFLINE_MODE=true
      - HOME=/tmp
      - STATIC_DIR=/tmp/static
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URL=http://patai-gateway:18000/v1
      - OPENAI_API_KEY=${PATAI_GATEWAY_KEY}
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_OPENAI_API_BASE_URL=http://patai-gateway:18000/v1
      - RAG_OPENAI_API_KEY=${PATAI_GATEWAY_KEY}
      - RAG_EMBEDDING_MODEL=nomic-embed-text-v1.5
      # nomic-embed-text wants each input to say which it is.
      - "RAG_EMBEDDING_QUERY_PREFIX=search_query: "
      - "RAG_EMBEDDING_CONTENT_PREFIX=search_document: "
      - WEB_SEARCH_ENGINE=searxng
      # Of a page the model fetches, about 3k tokens: a whole one can be more than a request's share of the context.
      - WEB_FETCH_MAX_CONTENT_LENGTH=12000
      # SearXNG takes no key, so the gateway takes the app's as a password.
      - SEARXNG_QUERY_URL=http://chat:${PATAI_GATEWAY_KEY}@patai-gateway:18000/search
      - IMAGE_GENERATION_ENGINE=openai
      - IMAGES_OPENAI_API_BASE_URL=http://patai-gateway:18000/v1
      - IMAGES_OPENAI_API_KEY=${PATAI_GATEWAY_KEY}
      - IMAGE_GENERATION_MODEL=flux
      - IMAGE_SIZE=512x512
      # Which of the app's APIs are on, for patai-start: search and images.
      - PATAI_APIS
      # Each costs the model a request after every answer. Titles stay.
      - ENABLE_FOLLOW_UP_GENERATION=false
      - ENABLE_TAGS_GENERATION=false
      # Code the model writes, and a code block a person runs, run in the person's browser, in Pyodide: never on the node.
      - ENABLE_CODE_INTERPRETER=true
      - CODE_INTERPRETER_ENGINE=pyodide
      - ENABLE_CODE_EXECUTION=true
      - CODE_EXECUTION_ENGINE=pyodide
      # Tools in Python, an owner's or one the model writes with its create_tool, would run in Open WebUI's own process,
      # beside its database's password and the app's key.
      - ENABLE_TOOLS=false
networks:
  chat:
    name: patai-chat
    external: true
