# patai's own chat web app, for Chat (docs/apps.md, The Chat app): Next.js serving the pages, which hold no
# data and call chat-server's API from the browser. The console serves them on 8443 and sends /api/ to chat-server, so
# this needs no network but its own. It runs chat-server's image, which manifest.json pins as that recipe does.
#
#   sudo patai-fetch chat-web                  on the node: the image, checked against the pin
services:
  server:
    # Back after a crash, but not by itself at boot: patai-workload decides what runs, and opens the gate.
    restart: on-failure
    image: ghcr.io/patrickwasp/patai-chat:0.15.2
    user: "10022:10022"
    read_only: true
    ports:
      - "127.0.0.1:18320:3000"
    command: ["node", "/app/web/apps/web/server.js"]
    tmpfs:
      - /tmp
      - /app/web/apps/web/.next/cache:uid=10022,gid=10022
    volumes:
      # The gate. Without it the container can't start, and /run is empty after every boot.
      - type: bind
        source: /run/patai/apps/chat-web
        target: /run/patai-gate
        read_only: true
        bind:
          create_host_path: false
    environment:
      # Next.js listens on the address HOSTNAME names, which Docker sets to the container's ID.
      - HOSTNAME=0.0.0.0
      - PORT=3000
