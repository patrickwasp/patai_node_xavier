# SearXNG, the agentic API's web search without a provider's key (docs/apps.md). It asks public search engines
# itself. manifest.json pins its image.
#
#   sudo patai-fetch searxng                   on the unit: the image, checked against the pin
#   scripts/workload searxng build
services:
  server:
    # Back after a crash, but not by itself at boot: patai-workload decides what runs, and opens the gate.
    restart: on-failure
    image: patai/searxng:2026.11.12
    build: .
    ports:
      - "127.0.0.1:18888:8080"
    # The agentic API asks it by name.
    networks:
      default:
      ai:
        aliases: [searxng]
    volumes:
      # The gate. Without it the container can't start, and /run is empty after every boot.
      - type: bind
        source: /run/patai/apps/searxng
        target: /run/patai-gate
        read_only: true
        bind:
          create_host_path: false
    environment:
      - SEARXNG_SECRET
networks:
  ai:
    name: patai-ai
    external: true
