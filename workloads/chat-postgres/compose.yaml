# Chat preview's Postgres (docs/apps.md, Chat preview), on the app's own network and nowhere else: people, sessions,
# chats and answers, for chat-server. It runs Open WebUI's Postgres image, which manifest.json pins as that recipe does,
# and keeps its database in /data/chat-postgres.
#
#   sudo patai-fetch chat-postgres             on the node: the image, checked against the pin
services:
  server:
    # Back after a crash, but not by itself at boot: patai-workload decides what runs, and opens the gate.
    restart: on-failure
    image: ghcr.io/patrickwasp/patai-open-webui-postgres:0.8.7-pg18
    # Its own user, who owns the data folder: the image's entrypoint takes any.
    user: "10020:10020"
    networks:
      chat:
        aliases: [chat-postgres]
    volumes:
      - /data/chat-postgres:/var/lib/postgresql
      # The gate. Without it the container can't start, and /run is empty after every boot.
      - type: bind
        source: /run/patai/apps/chat-postgres
        target: /run/patai-gate
        read_only: true
        bind:
          create_host_path: false
    environment:
      - POSTGRES_USER=patai
      - POSTGRES_DB=patai_chat
      - POSTGRES_PASSWORD
    # Its ready check, which the console reads from Docker: it has no HTTP.
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "patai", "-d", "patai_chat"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
networks:
  chat:
    name: patai-chat-preview
    external: true
