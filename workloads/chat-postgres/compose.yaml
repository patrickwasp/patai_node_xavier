# Chat's Postgres (docs/apps.md, The Chat app), on the app's own network and nowhere else: people, sessions, chats
# and answers, for chat-server. pgvector's own image, which manifest.json pins, and it keeps its database in
# /data/chat-postgres/<cluster>/docker, a folder for each Postgres major and one-way change (patai-postgres).
#
#   sudo patai-fetch chat-postgres             on the node: the image, checked against the pin
services:
  server:
    # Back after a crash, but not by itself at boot: patai-workload decides what runs, and opens the gate.
    restart: on-failure
    image: ghcr.io/patrickwasp/patai-postgres:0.8.7-pg18-2
    # Its own user, who owns the data folder: the image's entrypoint takes any.
    user: "10020:10020"
    networks:
      chat:
        aliases: [chat-postgres]
    # No name from outside the node: Docker's resolver answers its containers' names and asks this address for the
    # rest, from the container, where the firewall refuses it. Nobody has the address (docs/apps.md, The internet).
    dns: [192.0.2.1]
    volumes:
      - /data/chat-postgres:/var/lib/postgresql
      # The gate. Without it the container can't start, and /run is empty after every boot.
      - type: bind
        source: /run/patai/apps/chat-postgres
        target: /run/patai-gate
        read_only: true
        bind:
          create_host_path: false
    environment:
      - POSTGRES_USER=patai
      - POSTGRES_DB=patai_chat
      - POSTGRES_PASSWORD
      # Which release runs it, so its image lets go of an older cluster once a later release than the one that moved
      # it runs (patai-postgres).
      - PATAI_RELEASE
    # Its ready check, which the console reads from Docker: it has no HTTP.
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "patai", "-d", "patai_chat"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
networks:
  chat:
    name: patai-chat
    external: true
