# Open WebUI's Valkey (docs/apps.md, The Chat app), on the Chat app's own network and nowhere else. It keeps nothing on
# the disk: what it holds is for answers under way. manifest.json pins its image.
#
#   sudo patai-fetch open-webui-valkey         on the node: the image, checked against the pin
#   scripts/workload open-webui-valkey build
services:
  server:
    # Back after a crash, but not by itself at boot: patai-workload decides what runs, and opens the gate.
    restart: on-failure
    image: ghcr.io/patrickwasp/patai-open-webui-valkey:9.1.3
    build: .
    user: "10012:10012"
    read_only: true
    networks:
      chat:
        aliases: [open-webui-valkey]
    tmpfs:
      - /tmp
    volumes:
      # The gate. Without it the container can't start, and /run is empty after every boot.
      - type: bind
        source: /run/patai/apps/open-webui-valkey
        target: /run/patai-gate
        read_only: true
        bind:
          create_host_path: false
    environment:
      - VALKEY_PASSWORD
    # The password in a file, not on its command line, which every process on the node can read.
    entrypoint: ["sh", "-c", 'printf "requirepass %s\n" "$$VALKEY_PASSWORD" > /tmp/valkey.conf && exec valkey-server /tmp/valkey.conf --save "" --appendonly no']
    # Its ready check, which the console reads from Docker: it has no HTTP.
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
networks:
  chat:
    name: patai-chat
    external: true
