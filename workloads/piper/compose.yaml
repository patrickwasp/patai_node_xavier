# Piper on the CPU, behind the text-to-speech APIs (docs/apps.md, Voice). manifest.json pins its image and voices, in
# /data/models/piper.
#
#   sudo patai-fetch piper                      on the unit: the image and voices, checked against the pins
#   scripts/workload piper build
#   scripts/workload piper up -d server          OpenAI's /v1/audio/speech on 127.0.0.1:18401
services:
  server:
    # Back after a crash, but not by itself at boot: patai-workload decides what runs, and opens the gate.
    restart: on-failure
    image: ghcr.io/patrickwasp/patai-piper:1.8.0-2
    build: .
    ports:
      - "127.0.0.1:18401:8080"
    # No name from outside the node: Docker's resolver answers its containers' names and asks this address for the
    # rest, from the container, where the firewall refuses it. Nobody has the address (docs/apps.md, The internet).
    dns: [192.0.2.1]
    # Half the cores: a sentence takes a fraction of a second, and the model's server keeps the rest.
    cpus: 4
    read_only: true
    # Root in it reads the voices, which are root's alone, as their owner, and needs nothing more.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /data/models/piper:/models:ro
      # The gate. Without it the container can't start, and /run is empty after every boot.
      - type: bind
        source: /run/patai/apps/piper
        target: /run/patai-gate
        read_only: true
        bind:
          create_host_path: false
    # The default voice, which a request that names none gets.
    command: ["/models/${PIPER_VOICE:-en_US-ljspeech-medium.onnx}",
      "${PIPER_VOICE_CONFIG:-/models/en_US-ljspeech-medium.onnx.json}"]
