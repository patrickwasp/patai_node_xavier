# What system.slice's services are given of memory (docs/console.md, Memory). cgroup v2 protects a group only as
# far as its parent's protection covers it, and focal's systemd mounts cgroup2 without memory_recursiveprot, so this
# is the sum of what they ask for: MemoryMin= for the console's two, MemoryLow= for Docker's two. It protects
# nothing else in the slice. A change to one of them is a change here too.
[Slice]
MemoryMin=384M
MemoryLow=448M
