# nvbootctrl verify, this script's last step, can't delete BootChainFwStatus on this chip, so it fails
# on the first boot after any slot switch and the unit reports degraded. rauc status mark-good queues
# the deletion instead (docs/updates.md). With no stored result a failure here is a real one.
[Service]
ExecStart=
ExecStart=/bin/sh -c '/opt/nvidia/l4t-bootloader-config/nv-l4t-bootloader-config.sh -v || [ -e /sys/firmware/efi/efivars/BootChainFwStatus-781e084c-a330-417c-b678-38e696380cb9 ]'
