# NVIDIA's script set the clock from the backup RTC unconditionally, and without an RTC battery that's
# 2000-01-01 after every power cut, which undid what systemd and timesyncd had restored (docs/console.md,
# Clock). Before the console, so that what it records starts with the best time the unit has.
[Unit]
Before=patai-api.service

[Service]
ExecStart=
ExecStart=/usr/local/sbin/patai-clock boot
