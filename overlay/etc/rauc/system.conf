# keyring.pem is the fleet CA certificate (docs/updates.md, Keys). resize=true because a bundle's
# image is smaller than a slot.
[system]
compatible=patai-node-xavier
bootloader=custom
bundle-formats=-plain
data-directory=/persist/rauc

[handlers]
bootloader-custom-backend=/usr/lib/rauc/tegra-slots

[keyring]
path=/etc/rauc/keyring.pem
check-purpose=codesign

[slot.rootfs.0]
device=/dev/disk/by-partlabel/APP
type=ext4
bootname=A
resize=true

[slot.rootfs.1]
device=/dev/disk/by-partlabel/APP_b
type=ext4
bootname=B
resize=true
