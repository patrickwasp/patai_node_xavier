# Transparent huge pages only where a program asks for them (docs/hardware.md, Huge pages). With L4T's "always",
# khugepaged merges pages under llama-server's host buffers while nvmap pins them for the GPU, and the unit hung twice
# that way: llama-server and khugepaged stuck in D state, a workqueue lockup, and a restart taking up to 19 minutes.
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
